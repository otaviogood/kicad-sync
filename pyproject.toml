[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicadsync"
version = "0.1.0"
description = "JSON-first KiCad schematic workflow: describe a PCB in JSON, sync it to KiCad 9, and check JLCPCB part price/stock"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Otavio Good" }]
requires-python = ">=3.10"
dependencies = ["sexpdata>=1.0"]
keywords = ["kicad", "pcb", "schematic", "eda", "jlcpcb", "bom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/otaviogood/kicad-tools"

[project.scripts]
kicadsync = "kicadsync.cli:main"

[tool.setuptools]
packages = ["kicadsync"]

[tool.setuptools.package-data]
kicadsync = ["templates/*.tpl", "templates/agents/*.md"]
